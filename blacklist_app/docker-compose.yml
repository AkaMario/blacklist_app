services:
  app:
    build:
      context: .
      platforms:
        - linux/amd64
    ports:
      - "5001:8080"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/blacklist_db

  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blacklist_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
