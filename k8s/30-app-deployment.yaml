apiVersion: apps/v1
kind: Deployment
metadata:
  name: blacklist-app
  namespace: curso
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blacklist-app
  template:
    metadata:
      labels:
        app: blacklist-app
        version: '1.0'
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:14
        command:
        - sh
        - -c
        - until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep
          2; done
        envFrom:
        - configMapRef:
            name: postgres-config
      containers:
      - name: blacklist-app
        image: blacklist-app:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: blacklist-secret
              key: DATABASE_URL
        - name: BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: blacklist-secret
              key: BEARER_TOKEN
        startupProbe:
          httpGet:
            path: /blacklists/ping
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /blacklists/ping
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /blacklists/ping
            port: http
          periodSeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
